name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh of the feeds, early morning in Europe.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a new run waits instead of cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Fetch feeds and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .

      # The last good output of every fetcher, so a source that fails today
      # still shows yesterday's data instead of disappearing.
      - name: Restore last good feeds
        uses: actions/cache/restore@v4
        with:
          path: |
            src/data/live
            public/media/feeds
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feeds-

      # Exits non-zero only when no fetcher succeeded; the site still deploys
      # with cached or hidden cards, and the step summary says which.
      - name: Fetch feeds
        continue-on-error: true
        run: python -m scripts.fetch_all
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}

      # Failed fetchers leave the restored files untouched, so this saves fresh
      # output where a fetch worked and the previous good copy everywhere else.
      - name: Save feeds for the next run
        if: hashFiles('src/data/live/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            src/data/live
            public/media/feeds
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
