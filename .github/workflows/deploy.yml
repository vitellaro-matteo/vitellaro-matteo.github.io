name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh of the feeds, early morning in Europe.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a new run waits instead of cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Fetch feeds and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .

      # The last good output of every fetcher, so a source that fails today
      # still shows yesterday's data instead of disappearing.
      - name: Restore last good feeds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/data/live
            public/media/feeds
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feeds-

      # Exits non-zero only when no fetcher succeeded; the site still deploys
      # with cached or hidden cards, and the step summary says which.
      - name: Fetch feeds
        continue-on-error: true
        run: python -m scripts.fetch_all
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      # Failed fetchers leave the restored files untouched, so this saves fresh
      # output where a fetch worked and the previous good copy everywhere else.
      - name: Save feeds for the next run
        if: hashFiles('src/data/live/*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/data/live
            public/media/feeds
          key: feeds-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
